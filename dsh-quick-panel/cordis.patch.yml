# dsh-quick-panel bundle patch
#
# 本包自带 patch 行 —— DSH 的 bundle 机制会在装载本 bundle 时自动建行，
# 因此不要在 profile 的 cordis.patch.yml 里再 insert 同一行（重复注册会被拒写）。
#
# host 半（lib/index.js）只占一个 loader 行；client 半（lib/client.js，
# 由 package.json 的 dsh.client 声明）注册：
#   * 侧边栏图标 sidebar.panellist (id: quick-panel)
#   * 中列面板   main               (key: quick-panel)
- insert:
    - id: quick-panel
      name: 'dsh-quick-panel'
